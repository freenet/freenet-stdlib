name: Rust CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]

jobs:
  test_all:
    name: Test features

    runs-on: ubuntu-latest

    env:
      FREENET_LOG: error
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Test - features
        run: cargo test --workspace --features contract,net,testing,trace

  build_targets:
    name: Build targets

    runs-on: ubuntu-latest
    strategy:
      matrix:
        targets: ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
    env:
      FREENET_LOG: error
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build - freenet-stdlib
        working-directory: rust
        run: cargo build --target ${{ matrix.targets }}

  clippy_check:
    name: Clippy

    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
    env:
      FREENET_LOG: error
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: clippy - freenet-stdlib
        working-directory: rust
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

  fmt_check:
    name: Fmt

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check code formatting
        run: cargo fmt -- --check

  typescript_test:
    name: TypeScript SDK tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  flatbuffers_drift:
    name: Flatbuffers bindings match schemas

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned deliberately. Different flatc releases format their output
      # differently, so this job compares against one specific compiler; bump it
      # and PINNED_FLATC in rust/build.rs together, in a commit that also
      # regenerates.
      # Downloaded outside the checkout on purpose: anything left in the working
      # tree would show up as untracked, and the staleness check below treats
      # untracked files as drift.
      - name: Install pinned flatc
        env:
          FLATC_VERSION: 24.3.25
        run: |
          curl -sSfL -o "$RUNNER_TEMP/flatc.zip" \
            "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip"
          unzip -q "$RUNNER_TEMP/flatc.zip" -d "$HOME/.flatc"
          chmod +x "$HOME/.flatc/flatc"
          echo "$HOME/.flatc" >> "$GITHUB_PATH"

      - name: Verify flatc version
        run: |
          # A silently-different compiler would make this whole job compare the
          # wrong thing and pass, which is the failure mode it exists to prevent.
          installed="$(flatc --version | awk '{print $NF}')"
          if [ "$installed" != "24.3.25" ]; then
            echo "expected flatc 24.3.25, got '$installed'" >&2
            exit 1
          fi

      # build.rs runs cargo fmt itself and panics if anything goes wrong, so a
      # regeneration that cannot run fails here rather than reaching the
      # comparison below having quietly changed nothing.
      - name: Regenerate Rust bindings
        working-directory: rust
        run: FREENET_REGEN_FLATBUFFERS=1 cargo build

      - name: Regenerate TypeScript bindings
        working-directory: typescript
        run: |
          npm install
          npm run flatc-schemas

      # Until this job existed nothing compared the schemas to the bindings: the
      # build regenerated only when a contributor happened to have flatc, and CI
      # never installed it, so a schema edit that was never regenerated compiled
      # and passed against bindings describing the previous schema.
      # `git status --porcelain`, not `git diff --exit-code`: a new .fbs file
      # generates entirely NEW binding files, which are untracked, and a plain
      # diff reports a clean tree for them. That would let a schema merge with no
      # committed bindings at all -- the loudest version of the drift this job
      # exists to catch, sailing straight past it.
      - name: Fail if the committed bindings are stale
        run: |
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "The committed flatbuffers bindings do not match the schemas." >&2
            echo >&2
            echo "$changes" >&2
            echo >&2
            echo "Regenerate them and commit the result:" >&2
            echo "  (cd rust && FREENET_REGEN_FLATBUFFERS=1 cargo build)" >&2
            echo "  (cd typescript && npm run flatc-schemas)" >&2
            echo "This needs flatc 24.3.25 specifically; another release reformats every file." >&2
            exit 1
          fi

  claude-ci-analysis:
    name: Claude CI Analysis

    runs-on: ubuntu-latest
    needs: [test_all, build_targets, clippy_check, fmt_check, typescript_test]
    if: failure() && contains(github.event.pull_request.labels.*.name, 'claude-debug')

    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude CI Analysis
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The CI workflow has failed. Please analyze the failure and provide:
            1. Root cause of the failure
            2. Specific steps to fix the issue
            3. Whether this appears to be a flaky test or genuine bug
            4. Any relevant context from the codebase

            Use the repository's CLAUDE.md for guidance on testing and debugging.

            After your analysis, use `gh pr comment` with your Bash tool to post your findings as a comment on the PR.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh run view:*)"'
